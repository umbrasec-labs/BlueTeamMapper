# Build the Vite app and publish dist/ to GitHub Pages.
# One-time setup: Settings → Pages → Build and deployment → Source: "GitHub Actions".
name: deploy
on:
  push:
    branches: [main]
  # Daily rebuild picks up new sigma-pack rules and umbra-blue skills.
  schedule:
    - cron: '17 6 * * *'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      # Detections come from the canonical sources, synced fresh on every deploy.
      # The Claims Ledger harness reads the writeups in research/ as well as the rules.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: umbrasec-labs/umbrasec.dev
          path: .sources/umbrasec.dev
          sparse-checkout: |
            tools/sigma-pack
            research
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: umbrasec-labs/umbra-blue
          path: .sources/umbra-blue
      # Claims Ledger: re-prove each rule's claims against the same umbrasec.dev checkout the
      # sync reads, so the claims shown were proved on the exact bytes the mapper displays.
      # Every step here may fail without blocking the deploy; the sync then runs without claims.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        continue-on-error: true
        timeout-minutes: 3
        with:
          repository: umbrasec-labs/detections
          path: .sources/detections
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        continue-on-error: true
        timeout-minutes: 3
        with:
          python-version: '3.12'
      - name: Install the claims harness
        continue-on-error: true
        timeout-minutes: 5
        run: python -m pip install --require-hashes --no-deps -r .sources/detections/requirements.txt
      - name: Prove the claims
        continue-on-error: true
        timeout-minutes: 5
        working-directory: .sources/detections
        run: python -m harness.run --upstream ../umbrasec.dev --out ../claims --exit-zero
      - name: Sync detections
        run: |
          claims=()
          if [ -f .sources/claims/claims.json ]; then
            claims=(--claims .sources/claims/claims.json)
          else
            echo "::warning::No claims.json from the harness. Syncing without claims."
          fi
          npm run sync:detections -- --sigma-pack .sources/umbrasec.dev/tools/sigma-pack --umbra-blue .sources/umbra-blue "${claims[@]}"
      # Project site at https://<owner>.github.io/<repo>/. For a user/org site or a
      # custom domain served from the root, set VITE_BASE: /
      - run: npm run build
        env:
          VITE_BASE: /${{ github.event.repository.name }}/
      # Scan exactly what will be published, synced content included, with this repo's
      # .gitleaks.toml. A secret or PII hit blocks the deploy. The binary is checked
      # against the release's published sha256.
      - name: Scan the build for secrets and PII
        run: |
          curl -sSfL -o "$RUNNER_TEMP/gitleaks.tar.gz" https://github.com/gitleaks/gitleaks/releases/download/v8.30.1/gitleaks_8.30.1_linux_x64.tar.gz
          echo "551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb  $RUNNER_TEMP/gitleaks.tar.gz" | sha256sum -c -
          tar -xzf "$RUNNER_TEMP/gitleaks.tar.gz" -C "$RUNNER_TEMP" gitleaks
          "$RUNNER_TEMP/gitleaks" dir dist --config .gitleaks.toml --redact --no-banner
      - uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1
