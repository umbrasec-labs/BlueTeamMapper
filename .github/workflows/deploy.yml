# Build the Vite app and publish dist/ to GitHub Pages.
# One-time setup: Settings → Pages → Build and deployment → Source: "GitHub Actions".
name: deploy
on:
  push:
    branches: [main]
  # Daily rebuild picks up new sigma-pack rules and umbra-blue skills.
  schedule:
    - cron: '17 6 * * *'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      # Detections come from the canonical sources, synced fresh on every deploy.
      - uses: actions/checkout@v4
        with:
          repository: umbrasec-labs/umbrasec.dev
          path: .sources/umbrasec.dev
          sparse-checkout: tools/sigma-pack
      - uses: actions/checkout@v4
        with:
          repository: umbrasec-labs/umbra-blue
          path: .sources/umbra-blue
      - run: npm run sync:detections -- --sigma-pack .sources/umbrasec.dev/tools/sigma-pack --umbra-blue .sources/umbra-blue
      # Project site at https://<owner>.github.io/<repo>/. For a user/org site or a
      # custom domain served from the root, set VITE_BASE: /
      - run: npm run build
        env:
          VITE_BASE: /${{ github.event.repository.name }}/
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
